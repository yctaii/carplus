name: Android CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Relocate root uploaded Kotlin files (if any)
        run: |
          [ -f "SessionController.kt" ] && mv -f "SessionController.kt" "app/src/main/java/io/github/shaonialife/cardeck/SessionController.kt" || true
          [ -f "Iap2LinkEngine.kt" ] && mv -f "Iap2LinkEngine.kt" "app/src/main/java/io/github/shaonialife/cardeck/iap2/Iap2LinkEngine.kt" || true
          [ -f "Iap2SenderSession.kt" ] && mv -f "Iap2SenderSession.kt" "app/src/main/java/io/github/shaonialife/cardeck/iap2/Iap2SenderSession.kt" || true
          [ -f "Iap2LinkChannel.kt" ] && mv -f "Iap2LinkChannel.kt" "app/src/main/java/io/github/shaonialife/cardeck/transport/Iap2LinkChannel.kt" || true
          [ -f "AirPlayClient.kt" ] && mv -f "AirPlayClient.kt" "app/src/main/java/io/github/shaonialife/cardeck/airplay/AirPlayClient.kt" || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Standard Debug APK
        run: ./gradlew assembleStandardDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cardeck-standard-debug-apk
          path: app/build/outputs/apk/standard/debug/*.apk
